name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags so assemble can carry CSS/JS from HEAD^1
          # and the two newest v* tags. Do not set ASSEMBLE_FIRST_RUN here.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          # GitHub does not allow an Actions workflow to grant administration,
          # which creating a Pages site requires. Set repository secret
          # PAGES_ENABLE_TOKEN (fine-grained PAT: Pages and Administration write)
          # or enable Pages once under Settings → Pages → Source: GitHub Actions.
          token: ${{ secrets.PAGES_ENABLE_TOKEN != '' && secrets.PAGES_ENABLE_TOKEN || github.token }}

      - name: Assemble site
        # Fails when HEAD^1 and previous v* tags are both unavailable.
        # First-deploy override (leave unset): ASSEMBLE_FIRST_RUN=1 or --first-run.
        run: python3 tools/assemble_site.py _site

      - name: Verify assembled site
        # Same override as assemble, and it is not set in this workflow.
        run: |
          python3 tools/verify_site.py _site
          python3 tools/check_css.py _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
