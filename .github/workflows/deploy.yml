name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (vX.Y.Z) to retry deployment for this exact commit
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          # Full history and tags so assemble can carry CSS/JS from HEAD^1
          # and the two newest v* tags. Do not set ASSEMBLE_FIRST_RUN here.
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require release tag to match the exact verified commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"

      - name: Setup Pages
        uses: actions/configure-pages@v5.0.0
        with:
          enablement: true
          # GitHub does not allow an Actions workflow to grant administration,
          # which creating a Pages site requires. Set repository secret
          # PAGES_ENABLE_TOKEN (fine-grained PAT: Pages and Administration write)
          # or enable Pages once under Settings → Pages → Source: GitHub Actions.
          token: ${{ secrets.PAGES_ENABLE_TOKEN != '' && secrets.PAGES_ENABLE_TOKEN || github.token }}

      - name: Assemble site
        # Fails when HEAD^1 and previous v* tags are both unavailable.
        # First-deploy override (leave unset): ASSEMBLE_FIRST_RUN=1 or --first-run.
        run: python3 tools/assemble_site.py _site

      - name: Verify assembled site
        # Same override as assemble, and it is not set in this workflow.
        run: |
          python3 tools/verify_site.py _site
          python3 tools/check_css.py _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
