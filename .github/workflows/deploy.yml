name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          # GitHub does not allow an Actions workflow to grant administration,
          # which creating a Pages site requires. Set repository secret
          # PAGES_ENABLE_TOKEN (fine-grained PAT: Pages and Administration write)
          # or enable Pages once under Settings → Pages → Source: GitHub Actions.
          token: ${{ secrets.PAGES_ENABLE_TOKEN != '' && secrets.PAGES_ENABLE_TOKEN || github.token }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html 404.html privacy.html terms.html CNAME .nojekyll _site/
          cp -a assets styles _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
