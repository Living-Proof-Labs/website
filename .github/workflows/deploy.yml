name: Deploy verified website to GitHub Pages
on:
  workflow_call:
    inputs:
      release_tag: {type: string, required: true}
      release_version: {type: string, required: true}
      commit: {type: string, required: true}
      run: {type: string, required: true}
      attempt: {type: string, required: true}
      artifact_id: {type: string, required: true}
      digest: {type: string, required: true}
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published stable tag pointing to current main
        required: true
        type: string
permissions:
  contents: read
jobs:
  version:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release-candidate.yml@v9.9.12
    with:
      replay-tag: ${{ inputs.release_tag }}
  site:
    needs: version
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/site-artifact.yml
    with:
      version: ${{ needs.version.outputs.semver-version }}
      commit: ${{ needs.version.outputs.commit }}
      run: ${{ needs.version.outputs.run-id }}
      attempt: ${{ needs.version.outputs.run-attempt }}
  deploy:
    needs: [version, site]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.site.result == 'skipped') ||
       (github.event_name == 'workflow_dispatch' && needs.version.result == 'success' &&
        needs.site.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION: ${{ inputs.release_version || needs.version.outputs.semver-version }}
      SOURCE: ${{ inputs.commit || needs.version.outputs.commit }}
      PLAN_RUN: ${{ inputs.run || needs.version.outputs.run-id }}
      PLAN_ATTEMPT: ${{ inputs.attempt || needs.version.outputs.run-attempt }}
      ARTIFACT_ID: ${{ inputs.artifact_id || needs.site.outputs.artifact-id }}
      DIGEST: ${{ inputs.digest || needs.site.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the published stable release and exact current-run source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$RELEASE_TAG" = "v$VERSION"
          test "$SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$SOURCE"
          test "$PLAN_RUN" = "$GITHUB_RUN_ID"
          test "$PLAN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | python3 -c '
          import json, sys
          info = json.load(sys.stdin)
          published = info.get("published_at") if isinstance(info, dict) else None
          if not (isinstance(published, str) and published and info.get("tag_name") == sys.argv[1]
                  and info.get("draft") is False and info.get("prerelease") is False):
              raise SystemExit("Expected a published stable website release")
          ' "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.artifact_id || needs.site.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/verified-website
      - name: Require exactly the sealed archive before publishing
        id: pages-package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/verified-website/artifact.tar"
          printf '%s  %s\n' "$DIGEST" "$archive" | sha256sum --check
          cp "$archive" "$RUNNER_TEMP/artifact.tar"
          echo "tar-sha256=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: pages-artifact
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      # Use the same-run Actions artifact client (like deploy-pages), not the REST index.
      # An exact ID and name must both resolve to the sealed Pages tar before deploying.
      - name: Require a valid Pages artifact ID
        shell: bash
        env:
          UPLOADED_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        run: |
          [[ "$UPLOADED_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Read exact Pages artifact by ID
        id: pages-id-first
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.pages-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/website-pages-id-first
      - name: Allow the ID lookup to settle
        if: steps.pages-id-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by ID once
        id: pages-id-retry
        if: steps.pages-id-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.pages-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/website-pages-id-retry
      - name: Read exact Pages artifact by name
        id: pages-name-first
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/website-pages-name-first
      - name: Allow the name lookup to settle
        if: steps.pages-name-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by name once
        id: pages-name-retry
        if: steps.pages-name-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/website-pages-name-retry
      - name: Require matching ID and name readback of the exact tar
        shell: bash
        env:
          EXPECTED_TAR: ${{ steps.pages-package.outputs.tar-sha256 }}
          EXPECTED_NAME: github-pages-${{ github.run_attempt }}
          ID_READBACK: ${{ steps.pages-id-first.outcome == 'success' && steps.pages-id-first.outputs.download-path || steps.pages-id-retry.outputs.download-path }}
          NAME_READBACK: ${{ steps.pages-name-first.outcome == 'success' && steps.pages-name-first.outputs.download-path || steps.pages-name-retry.outputs.download-path }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAR" =~ ^[0-9a-f]{64}$ ]]
          test -n "$ID_READBACK"
          test -n "$NAME_READBACK"
          for path in "$ID_READBACK/$EXPECTED_NAME" "$NAME_READBACK"; do
            test -f "$path/artifact.tar"
            digest=$(sha256sum "$path/artifact.tar")
            test "${digest%% *}" = "$EXPECTED_TAR"
          done
      - name: Require current main inside the deployment lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$SOURCE"
      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
