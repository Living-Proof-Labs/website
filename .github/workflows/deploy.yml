name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # First deploy: set repo secret PAGES_ENABLE_TOKEN (PAT with Pages write + Administration write)
          # or enable Pages once under Settings → Pages → Source: GitHub Actions.
          enablement: true
          token: ${{ secrets.PAGES_ENABLE_TOKEN != '' && secrets.PAGES_ENABLE_TOKEN || github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            CNAME
            .nojekyll
            assets
            styles

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
