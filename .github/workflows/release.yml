name: Website release
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Verify static site inputs
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - run: task verify
  version:
    if: github.event_name == 'push' || github.base_ref == 'main'
    permissions:
      contents: read
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release-candidate.yml@v9.9.3
  site:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/site-artifact.yml
    with:
      version: ${{ needs.version.outputs.semver-version }}
      commit: ${{ needs.version.outputs.commit }}
      run: ${{ needs.version.outputs.run-id }}
      attempt: ${{ needs.version.outputs.run-attempt }}
  release:
    needs: [verify, version, site]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.outputs.version != '' &&
      needs.version.outputs.version == needs.version.outputs.semver-version &&
      needs.version.outputs.git-tag == format('v{0}', needs.version.outputs.version) &&
      needs.version.outputs.commit == github.sha &&
      needs.version.outputs.run-id == github.run_id &&
      needs.version.outputs.run-attempt == github.run_attempt &&
      needs.site.outputs.artifact-id != '' && needs.site.outputs.digest != ''
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.9.3
    with:
      expected-version: ${{ needs.version.outputs.version }}
      expected-commit: ${{ needs.version.outputs.commit }}
  deploy:
    needs: [verify, version, site, release]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release.outputs.published == 'true' &&
      needs.release.outputs.version == needs.version.outputs.version &&
      needs.release.outputs.git-tag == needs.version.outputs.git-tag &&
      needs.release.outputs.commit == needs.version.outputs.commit
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.release.outputs.git-tag }}
      release_version: ${{ needs.release.outputs.version }}
      commit: ${{ needs.release.outputs.commit }}
      run: ${{ needs.version.outputs.run-id }}
      attempt: ${{ needs.version.outputs.run-attempt }}
      artifact_id: ${{ needs.site.outputs.artifact-id }}
      digest: ${{ needs.site.outputs.digest }}
