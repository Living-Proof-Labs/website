version: '3'

tasks:
  check:
    desc: Check static-site deploy inputs and internal navigation
    cmds:
      - python3 tools/verify_site.py
      - python3 tools/check_css.py
      - python3 tools/verify_site.py --self-test
  verify:
    desc: Run all static-site verification
    cmds:
      - task: check
